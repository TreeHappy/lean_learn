<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* ============================================================
   Catppuccin Latte palette
   ============================================================ */
const L = {
  crust:0xdce0e8, mantle:0xe6e9ef, base:0xeff1f5, surface0:0xccd0da,
  text:0x4c4f69, subtext:0x6c7086, overlay:0x7c7f93,
  red:0xd20f39, peach:0xfe640b, yellow:0xdf8e1d, green:0x40a02b,
  teal:0x179299, sky:0x04a5e5, blue:0x1e66f5, lavender:0x7287fd,
  mauve:0x8839ef, pink:0xea76cb,
};
const col = (h, l = 1) => new THREE.Color(h).multiplyScalar(l);
// low → high: cool basins, warm summits
const RAMP = [L.blue, L.sky, L.teal, L.green, L.yellow, L.peach, L.pink, L.mauve, L.lavender]
  .map(h => new THREE.Color(h));

/* ============================================================
   Terrain: sum of gaussians with analytic gradient + hessian
   ============================================================ */
const EXT = 3.2;              // domain half-size
let bumps = [];

function newTerrain() {
  bumps = [];
  const n = 9;
  for (let i = 0; i < n; i++) {
    bumps.push({
      a: (i % 3 === 0 ? -1 : 1) * (0.5 + Math.random() * 1.1),   // some craters
      cx: (Math.random() * 2 - 1) * (EXT - 0.7),
      cy: (Math.random() * 2 - 1) * (EXT - 0.7),
      r2: 0.35 + Math.random() * 1.4,                            // sigma^2
    });
  }
}
newTerrain();

function heightAt(x, y) {
  let h = 0;
  for (const b of bumps) {
    const dx = x - b.cx, dy = y - b.cy;
    h += b.a * Math.exp(-(dx * dx + dy * dy) / b.r2);
  }
  return h;
}
// gradient + hessian in one pass: [hx, hy, hxx, hxy, hyy]
function derivativesAt(x, y) {
  let hx = 0, hy = 0, hxx = 0, hxy = 0, hyy = 0;
  for (const b of bumps) {
    const dx = x - b.cx, dy = y - b.cy, r2 = b.r2;
    const e = b.a * Math.exp(-(dx * dx + dy * dy) / r2);
    hx  += e * (-2 * dx / r2);
    hy  += e * (-2 * dy / r2);
    hxx += e * (4 * dx * dx / (r2 * r2) - 2 / r2);
    hxy += e * (4 * dx * dy / (r2 * r2));
    hyy += e * (4 * dy * dy / (r2 * r2) - 2 / r2);
  }
  return [hx, hy, hxx, hxy, hyy];
}

/* ============================================================
   Surface geometry
   X(x,y) = (x, y, h(x,y))
   G = [[1+hx², hx·hy], [hx·hy, 1+hy²]],  det G = 1+|∇h|²
   ============================================================ */
function ginvTimes(hx, hy, gx, gy) {
  const det = 1 + hx * hx + hy * hy;
  return [
    ((1 + hy * hy) * gx - hx * hy * gy) / det,
    (-(hx * hy) * gx + (1 + hx * hx) * gy) / det,
  ];
}

// geodesic acceleration: -G⁻¹ ((vᵀ H v) ∇h)
function geoAccel(px, py, vx, vy) {
  const [hx, hy, hxx, hxy, hyy] = derivativesAt(px, py);
  const hessQuad = vx * vx * hxx + 2 * vx * vy * hxy + vy * vy * hyy;
  return ginvTimes(hx, hy, -hessQuad * hx, -hessQuad * hy);
}

/* ============================================================
   RK4 integrator
   ============================================================ */
function rk4Step(s, dt, accelFn) {
  const f = (st) => {
    const [ax, ay] = accelFn(st);
    return [st[2], st[3], ax, ay];
  };
  const add = (a, b, k) => [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k, a[3] + b[3] * k];
  const k1 = f(s);
  const k2 = f(add(s, k1, dt / 2));
  const k3 = f(add(s, k2, dt / 2));
  const k4 = f(add(s, k3, dt));
  return [
    s[0] + dt / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]),
    s[1] + dt / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]),
    s[2] + dt / 6 * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]),
    s[3] + dt / 6 * (k1[3] + 2 * k2[3] + 2 * k3[3] + k4[3]),
  ];
}

const SHOOT_DT = 0.02;
const geoField = (st) => geoAccel(st[0], st[1], st[2], st[3]);

// shoot: integrate a geodesic, return UV samples
function shoot(px, py, dirx, diry, speed, maxSteps = 900) {
  let s = [px, py, speed * dirx, speed * diry];
  const pts = [[px, py]];
  for (let i = 0; i < maxSteps; i++) {
    s = rk4Step(s, SHOOT_DT, geoField);
    if (Math.abs(s[0]) > EXT + 0.5 || Math.abs(s[1]) > EXT + 0.5) break;
    pts.push([s[0], s[1]]);
  }
  return pts;
}

/* ============================================================
   Walk-mode dynamics: geodesic + gravity + applied force + friction
   q̈ = G⁻¹ ( f - (vᵀHv + g) ∇h ) - k v
   ============================================================ */
const GRAVITY   = 2.2;    // g, downhill acceleration
const PUSH      = 4.5;    // magnitude of the keyboard force
const FRICTION  = 0.9;    // rolling friction rate k
const BRAKE     = 5.0;    // extra friction while Space is held
const RESTITUTION = 0.55; // energy kept when bouncing off the boundary
const MARBLE_R  = 0.16;
const FIXED_DT  = 1 / 120;

const Z_AXIS = new THREE.Vector3(0, 0, 1);

function inputForce(hx, hy, n) {
  const d = new THREE.Vector2(0, 0);
  const fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd);
  fwd.z = 0;
  if (fwd.lengthSq() < 1e-8) fwd.set(0, -1, 0);
  fwd.normalize();
  const right = new THREE.Vector3().crossVectors(Z_AXIS, fwd).normalize();

  const keys = walk.keys;
  if (keys.has("w") || keys.has("arrowup"))    d.x += fwd.x, d.y += fwd.y;
  if (keys.has("s") || keys.has("arrowdown"))  d.x -= fwd.x, d.y -= fwd.y;
  if (keys.has("d") || keys.has("arrowright")) d.x += right.x, d.y += right.y;
  if (keys.has("a") || keys.has("arrowleft"))  d.x -= right.x, d.y -= right.y;
  if (d.lengthSq() < 1e-8) return [0, 0];
  d.normalize();

  // project the desired push onto the tangent plane, then into UV coordinates
  const F = new THREE.Vector3(d.x, d.y, 0);
  F.addScaledVector(n, -F.dot(n));
  F.multiplyScalar(PUSH * (keys.has("shift") ? 1.8 : 1));
  return [F.x + F.z * hx, F.y + F.z * hy];   // Q_i = F · X_i
}

function walkAccel(st) {
  const [hx, hy, hxx, hxy, hyy] = derivativesAt(st[0], st[1]);
  const n = new THREE.Vector3(-hx, -hy, 1).normalize();
  const [fx, fy] = inputForce(hx, hy, n);
  const hessQuad = st[2] * st[2] * hxx + 2 * st[2] * st[3] * hxy + st[3] * st[3] * hyy;
  const [ax, ay] = ginvTimes(hx, hy,
    fx - (hessQuad + GRAVITY) * hx,
    fy - (hessQuad + GRAVITY) * hy);
  const k = FRICTION + (walk.keys.has("space") ? BRAKE : 0);
  return [ax - k * st[2], ay - k * st[3]];
}

/* ============================================================
   Scene
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = col(L.base);
scene.fog = new THREE.Fog(col(L.base), 14, 32);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.up.set(0, 0, 1);
camera.position.set(7.5, -7.5, 6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 3;
controls.maxDistance = 25;

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const hemi = new THREE.HemisphereLight(0xffffff, 0xb4c3e6, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(-4, -6, 10);
scene.add(sun);

/* ---- colourful height-mapped surface ---- */
const N = 90;
let terrainMesh = null;

function rampColor(t) {
  if (!Number.isFinite(t)) t = 0;
  const f = Math.min(Math.max(t, 0), 1) * (RAMP.length - 1);
  const i = Math.min(Math.floor(f), RAMP.length - 2);
  return RAMP[i].clone().lerp(RAMP[i + 1], f - i);
}

function buildTerrain() {
  if (terrainMesh) {
    terrainMesh.forEach(m => { scene.remove(m); m.geometry.dispose(); m.material.dispose(); });
  }
  let hmin = Infinity, hmax = -Infinity;
  const H = [];
  for (let j = 0; j <= N; j++) {
    H.push([]);
    for (let i = 0; i <= N; i++) {
      const h = heightAt(-EXT + 2 * EXT * i / N, -EXT + 2 * EXT * j / N);
      H[j].push(h);
      hmin = Math.min(hmin, h); hmax = Math.max(hmax, h);
    }
  }
  const span = Math.max(hmax - hmin, 1e-6);
  const uv = (i, j) => [-EXT + 2 * EXT * i / N, -EXT + 2 * EXT * j / N];

  const pos = [], idx = [], vc = [];
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    const [x, y] = uv(i, j);
    pos.push(x, y, H[j][i]);
    const t = (H[j][i] - hmin) / span;
    const c = rampColor(t);
    // thin topographic bands: darken vertices close to a multiple of 1/14
    const bandDist = Math.abs(t * 14 - Math.round(t * 14));
    const shade = 0.82 + 0.18 * THREE.MathUtils.smoothstep(bandDist, 0.02, 0.12);
    vc.push(c.r * shade, c.g * shade, c.b * shade);
  }
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = j * (N + 1) + i, b = a + 1, c = a + N + 1, d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  const g1 = new THREE.BufferGeometry();
  g1.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g1.setAttribute("color", new THREE.Float32BufferAttribute(vc, 3));
  g1.setIndex(idx);
  g1.computeVertexNormals();
  const fill = new THREE.Mesh(g1, new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.85, metalness: 0.02,
    polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2,
  }));
  scene.add(fill);

  // ink grid, tinted by the height ramp
  const lp = [], lc = [];
  const pushLine = (x0, y0, x1, y1, h0, h1) => {
    const c0 = rampColor((h0 - hmin) / span).multiplyScalar(0.55);
    const c1 = rampColor((h1 - hmin) / span).multiplyScalar(0.55);
    lp.push(x0, y0, h0, x1, y1, h1);
    lc.push(c0.r, c0.g, c0.b, c1.r, c1.g, c1.b);
  };
  const SUB = 4;
  for (let j = 0; j <= N; j += 4) for (let i = 0; i < N; i += SUB) {
    const iEnd = Math.min(i + SUB, N);
    for (let k = i; k < iEnd; k++) {
      const [x0, y0] = uv(k, j), [x1, y1] = uv(k + 1, j);
      pushLine(x0, y0, x1, y1, H[j][k], H[j][k + 1]);
    }
  }
  for (let i = 0; i <= N; i += 4) for (let j = 0; j < N; j += SUB) {
    const jEnd = Math.min(j + SUB, N);
    for (let k = j; k < jEnd; k++) {
      const [x0, y0] = uv(i, k), [x1, y1] = uv(i, k + 1);
      pushLine(x0, y0, x1, y1, H[k][i], H[k + 1][i]);
    }
  }
  const g2 = new THREE.BufferGeometry();
  g2.setAttribute("position", new THREE.Float32BufferAttribute(lp, 3));
  g2.setAttribute("color", new THREE.Float32BufferAttribute(lc, 3));
  const lines = new THREE.LineSegments(g2, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.38, depthWrite: false,
  }));
  scene.add(lines);

  terrainMesh = [fill, lines];
}
buildTerrain();

/* ---- dotted trails: shader points with per-dot size / colour / alpha ---- */
function makeDots(maxDots) {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(maxDots * 3), 3));
  g.setAttribute("aColor", new THREE.BufferAttribute(new Float32Array(maxDots * 3), 3));
  g.setAttribute("aSize", new THREE.BufferAttribute(new Float32Array(maxDots), 1));
  g.setAttribute("aAlpha", new THREE.BufferAttribute(new Float32Array(maxDots), 1));
  g.setDrawRange(0, 0);
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.NormalBlending,
    uniforms: { uOpacity: { value: 1 } },
    vertexShader: `
      attribute vec3 aColor; attribute float aSize; attribute float aAlpha;
      varying vec3 vColor; varying float vAlpha;
      void main() {
        vColor = aColor; vAlpha = aAlpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * (240.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform float uOpacity;
      varying vec3 vColor; varying float vAlpha;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.32, d) * vAlpha * uOpacity;
        if (a < 0.003) discard;
        gl_FragColor = vec4(vColor, a);
        #include <colorspace_fragment>
      }`,
  });
  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  scene.add(pts);
  return pts;
}

const lift = (x, y) => new THREE.Vector3(x, y, heightAt(x, y));

function resample(uvPts, n) {
  const d = [0];
  for (let i = 1; i < uvPts.length; i++)
    d.push(d[i - 1] + Math.hypot(uvPts[i][0] - uvPts[i - 1][0], uvPts[i][1] - uvPts[i - 1][1]));
  const total = d[d.length - 1];
  if (total < 1e-9) return [];
  const out = [];
  let j = 0;
  for (let k = 0; k < n; k++) {
    const target = total * k / (n - 1);
    while (j < d.length - 2 && d[j + 1] < target) j++;
    const t = (target - d[j]) / Math.max(d[j + 1] - d[j], 1e-9);
    out.push([uvPts[j][0] + (uvPts[j + 1][0] - uvPts[j][0]) * t,
              uvPts[j][1] + (uvPts[j + 1][1] - uvPts[j][1]) * t]);
  }
  return out;
}

function writeDots(dotsObj, uvPts, colorA, colorB, baseSize, alpha, reveal = 1) {
  const n = Math.floor(uvPts.length * reveal);
  const pos = dotsObj.geometry.attributes.position;
  const ac = dotsObj.geometry.attributes.aColor;
  const as = dotsObj.geometry.attributes.aSize;
  const aa = dotsObj.geometry.attributes.aAlpha;
  const ca = col(colorA), cb = col(colorB), c = new THREE.Color();
  for (let k = 0; k < n; k++) {
    const p = lift(uvPts[k][0], uvPts[k][1]);
    pos.setXYZ(k, p.x, p.y, p.z + 0.015);
    const t = n > 1 ? k / (n - 1) : 1;
    c.copy(ca).lerp(cb, t);
    ac.setXYZ(k, c.r, c.g, c.b);
    as.setX(k, baseSize * (0.28 + 0.72 * t));
    const tailFade = THREE.MathUtils.smoothstep(t, 0, 0.18);
    aa.setX(k, alpha * (0.35 + 0.65 * tailFade));
  }
  dotsObj.geometry.setDrawRange(0, n);
  pos.needsUpdate = ac.needsUpdate = as.needsUpdate = aa.needsUpdate = true;
  dotsObj.material.uniforms.uOpacity.value = 1;
  return n;
}

function length3D(uvPts) {
  let L = 0;
  for (let i = 1; i < uvPts.length; i++)
    L += lift(uvPts[i][0], uvPts[i][1]).distanceTo(lift(uvPts[i - 1][0], uvPts[i - 1][1]));
  return L;
}

/* ============================================================
   The marble: position, surface frame and rolling orientation
   ============================================================ */
function glowTexture(inner, outer) {
  const cv = document.createElement("canvas"); cv.width = cv.height = 128;
  const ctx = cv.getContext("2d");
  const g = ctx.createRadialGradient(64, 64, 4, 64, 64, 64);
  g.addColorStop(0, inner); g.addColorStop(0.35, outer); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function marbleTexture() {
  const cv = document.createElement("canvas"); cv.width = cv.height = 512;
  const ctx = cv.getContext("2d");
  const hues = ["#1e66f5", "#8839ef", "#ea76cb", "#fe640b",
                "#df8e1d", "#40a02b", "#179299", "#04a5e5"];
  for (let i = 0; i < hues.length; i++) {
    ctx.fillStyle = hues[i];
    ctx.beginPath();
    ctx.moveTo(256, 256);
    ctx.arc(256, 256, 256, i * Math.PI / 4, (i + 1) * Math.PI / 4);
    ctx.closePath();
    ctx.fill();
  }
  ctx.strokeStyle = "rgba(239,241,245,0.85)";
  ctx.lineWidth = 16;
  for (const r of [110, 190]) { ctx.beginPath(); ctx.arc(256, 256, r, 0, 2 * Math.PI); ctx.stroke(); }
  ctx.fillStyle = "#4c4f69";
  ctx.beginPath(); ctx.arc(256, 34, 20, 0, 2 * Math.PI); ctx.fill(); // pole marker
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const marble = new THREE.Mesh(
  new THREE.SphereGeometry(MARBLE_R, 48, 32),
  new THREE.MeshStandardMaterial({ map: marbleTexture(), roughness: 0.32, metalness: 0.05 }),
);
scene.add(marble);

const ring = new THREE.Mesh(
  new THREE.RingGeometry(MARBLE_R * 1.5, MARBLE_R * 1.8, 48),
  new THREE.MeshBasicMaterial({ color: L.mauve, transparent: true, opacity: 0.8, side: THREE.DoubleSide, depthWrite: false }),
);
scene.add(ring);

const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(MARBLE_R * 1.25, 48),
  new THREE.MeshBasicMaterial({ color: L.text, transparent: true, opacity: 0.18, depthWrite: false }),
);
scene.add(shadow);

const player = { x: 0, y: 0, vx: 0, vy: 0, q: new THREE.Quaternion() };

function surfaceFrame(x, y) {
  const [hx, hy] = derivativesAt(x, y);
  return { hx, hy, n: new THREE.Vector3(-hx, -hy, 1).normalize() };
}

function updateMarbleTransform() {
  const { n } = surfaceFrame(player.x, player.y);
  const base = new THREE.Vector3(player.x, player.y, heightAt(player.x, player.y));
  marble.position.copy(base).addScaledVector(n, MARBLE_R);
  marble.quaternion.copy(player.q);
  ring.position.copy(base).addScaledVector(n, 0.01);
  ring.quaternion.setFromUnitVectors(Z_AXIS, n);
  shadow.position.copy(base).addScaledVector(n, 0.006);
  shadow.quaternion.copy(ring.quaternion);
}

function placeMarble(x, y) {
  player.x = x; player.y = y; player.vx = 0; player.vy = 0;
  walk.s = [x, y, 0, 0];
  updateMarbleTransform();
}
placeMarble(-1.6, -1.6);

// integrate the no-slip rolling constraint ω = (n × v_center) / r
function rollBy(vx, vy, dt) {
  const [hx, hy, hxx, hxy, hyy] = derivativesAt(player.x, player.y);
  const q = Math.sqrt(1 + hx * hx + hy * hy);
  const n = new THREE.Vector3(-hx / q, -hy / q, 1 / q);
  const a = hxx * vx + hxy * vy, b = hxy * vx + hyy * vy;
  const nDot = new THREE.Vector3(-a / q, -b / q, 0)
    .addScaledVector(n, -(hx * a + hy * b) / (q * q));
  const vCenter = new THREE.Vector3(vx, vy, hx * vx + hy * vy)
    .addScaledVector(nDot, MARBLE_R);
  const omega = new THREE.Vector3().crossVectors(n, vCenter).divideScalar(MARBLE_R);
  const theta = omega.length() * dt;
  if (theta > 1e-9) {
    const dq = new THREE.Quaternion().setFromAxisAngle(omega.normalize(), theta);
    player.q.premultiply(dq).normalize();
    marble.quaternion.copy(player.q);
  }
}

function pulse(t) {
  ring.material.opacity = 0.55 + 0.25 * Math.sin(t * 2.4);
}

/* ---- trails and shot state ---- */
const MAX_DOTS = 160;
let ghosts = [];
let active = null;
let currentPreview = null;
const previewDots = makeDots(MAX_DOTS);

function trimGhosts() {
  while (ghosts.length > 5) {
    const o = ghosts.shift();
    scene.remove(o); o.geometry.dispose(); o.material.dispose();
  }
  ghosts.forEach((g, i) => { g.material.uniforms.uOpacity.value = 0.16 + 0.1 * i; });
}

function pushGhost(dots) {
  ghosts.push(dots);
  trimGhosts();
}

function samplePath(pts, u) {
  if (pts.length < 2) return [pts[0]?.[0] ?? player.x, pts[0]?.[1] ?? player.y, 0, 0];
  const i = Math.min(Math.floor(u), pts.length - 2);
  const f = u - i;
  const x = pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f;
  const y = pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f;
  return [x, y, (pts[i + 1][0] - pts[i][0]) / SHOOT_DT, (pts[i + 1][1] - pts[i][1]) / SHOOT_DT];
}

function fire(uvPts) {
  if (active) finishActive(performance.now(), false);
  const len = uvPts.length > 1
    ? Math.hypot(uvPts.at(-1)[0] - uvPts[0][0], uvPts.at(-1)[1] - uvPts[0][1]) : 0;
  active = {
    dots: makeDots(MAX_DOTS), uvPts,
    t0: performance.now(),
    duration: 900 + len * 260,
  };
  head.visible = true;
}

function finishActive(now, impactAtEnd) {
  if (!active) return;
  const t = Math.min(Math.max((now - active.t0) / active.duration, 0), 1);
  const [x, y] = samplePath(active.uvPts, t * (active.uvPts.length - 1));
  writeDots(active.dots, active.uvPts, L.mauve, L.pink, 0.13, 0.32);
  pushGhost(active.dots);
  placeMarble(x, y);
  head.visible = false;
  if (impactAtEnd) impactFlash(active.uvPts.at(-1));
  active = null;
}

function updateActive(now, dt) {
  if (!active) return;
  const t = (now - active.t0) / active.duration;
  if (t >= 1) { finishActive(now, true); return; }
  const reveal = 0.12 + 0.88 * t;
  writeDots(active.dots, active.uvPts, L.mauve, L.pink, 0.2, 0.95, reveal);
  const [x, y, vx, vy] = samplePath(active.uvPts, t * (active.uvPts.length - 1));
  player.x = x; player.y = y; player.vx = vx; player.vy = vy;
  updateMarbleTransform();
  rollBy(vx, vy, dt);
  const { n } = surfaceFrame(x, y);
  head.position.copy(marble.position).addScaledVector(n, 0.03);
}

/* ---- impact flash ---- */
const head = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTexture("rgba(76,79,105,0.95)", "rgba(234,118,203,0.5)"),
  transparent: true, depthWrite: false, blending: THREE.NormalBlending,
}));
head.scale.set(0.32, 0.32, 1); head.visible = false;
scene.add(head);

const impact = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTexture("rgba(255,255,255,1)", "rgba(254,100,11,0.7)"),
  transparent: true, depthWrite: false, blending: THREE.NormalBlending, opacity: 0,
}));
impact.scale.set(1.2, 1.2, 1);
scene.add(impact);
let impactT = -1;

function impactFlash(lastUV) {
  const { n } = surfaceFrame(lastUV[0], lastUV[1]);
  impact.position.copy(lift(lastUV[0], lastUV[1])).addScaledVector(n, 0.08);
  impactT = performance.now();
}
function updateImpact(now) {
  if (impactT < 0) return;
  const t = (now - impactT) / 600;
  if (t >= 1) { impact.material.opacity = 0; impactT = -1; return; }
  impact.material.opacity = (1 - t) * 0.9;
  const s = 0.4 + 2.2 * t;
  impact.scale.set(s, s, 1);
}

/* ============================================================
   Walk-mode state and integration
   ============================================================ */
const walk = {
  s: [player.x, player.y, 0, 0],
  keys: new Set(),
  acc: 0,
};

function stepWalk(dt) {
  walk.s = rk4Step(walk.s, dt, walkAccel);
  const lim = EXT - 0.12;
  for (const [i, vi] of [[0, 2], [1, 3]]) {
    if (walk.s[i] > lim)  { walk.s[i] = lim;  walk.s[vi] = -Math.abs(walk.s[vi]) * RESTITUTION; }
    if (walk.s[i] < -lim) { walk.s[i] = -lim; walk.s[vi] =  Math.abs(walk.s[vi]) * RESTITUTION; }
  }
  player.x = walk.s[0]; player.y = walk.s[1];
  player.vx = walk.s[2]; player.vy = walk.s[3];
  updateMarbleTransform();
  rollBy(player.vx, player.vy, dt);
}

/* ============================================================
   Modes and UI
   ============================================================ */
let mode = null;
let follow = false;
let aiming = false, grabbing = false, downAt = null, downUV = null, moved = false;
const speedEl = document.getElementById("speedVal");
const speedLabel = document.getElementById("speedLabel");
const subtitle = document.getElementById("subtitle");
const hintEl = document.getElementById("hint");
const modeButtons = [...document.querySelectorAll(".mode")];

const HINTS = {
  pinball: `<b>drag from the marble</b> — aim &amp; power, release to fire<br>
            <b>click terrain</b> — move marble &nbsp;·&nbsp; <b>drag empty space</b> — orbit &nbsp;·&nbsp; <b>wheel</b> — zoom<br>
            <b>1 / 2</b> — switch mode &nbsp;·&nbsp; <b>R</b> — new terrain`,
  walk: `<b>WASD / arrows</b> — push the marble &nbsp;·&nbsp; <b>shift</b> — stronger &nbsp;·&nbsp; <b>space</b> — brake<br>
         <b>click terrain</b> — place marble &nbsp;·&nbsp; <b>F</b> — follow camera &nbsp;·&nbsp; <b>drag</b> — orbit &nbsp;·&nbsp; <b>wheel</b> — zoom<br>
         <b>1 / 2</b> — switch mode &nbsp;·&nbsp; <b>R</b> — new terrain`,
};

function setMode(next) {
  if (next === mode) return;
  if (active) finishActive(performance.now(), false);
  currentPreview = null;
  previewDots.geometry.setDrawRange(0, 0);
  aiming = false; grabbing = false;
  downAt = null; downUV = null; moved = false;
  controls.enabled = true;
  walk.keys.clear();
  walk.acc = 0;
  if (next === "walk") walk.s = [player.x, player.y, 0, 0];
  mode = next;
  modeButtons.forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  subtitle.textContent = mode === "pinball" ? "geodesic pinball" : "rolling on the surface";
  speedLabel.textContent = mode === "pinball" ? "power" : "speed";
  speedEl.textContent = "—";
  hintEl.innerHTML = HINTS[mode];
}
setMode("pinball");

modeButtons.forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));

/* ============================================================
   Input: raycast picking, aim / grab, orbit, keyboard
   ============================================================ */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pickTerrain(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(terrainMesh[0])[0];
  return hit ? new THREE.Vector2(hit.point.x, hit.point.y) : null;
}

renderer.domElement.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  downAt = { x: e.clientX, y: e.clientY };
  moved = false;
  const uv = pickTerrain(e);
  downUV = uv;
  if (uv && uv.distanceTo(new THREE.Vector2(player.x, player.y)) < 0.9) {
    controls.enabled = false;
    renderer.domElement.setPointerCapture(e.pointerId);
    if (mode === "pinball") aiming = true;
    else grabbing = true;
  }
});

renderer.domElement.addEventListener("pointermove", (e) => {
  if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) moved = true;
  if (grabbing) {
    const uv = pickTerrain(e);
    if (uv) placeMarble(uv.x, uv.y);
    return;
  }
  if (!aiming) return;
  const uv = pickTerrain(e);
  if (!uv) return;
  const d = uv.clone().sub(new THREE.Vector2(player.x, player.y));
  const len = Math.min(d.length(), 2.4);
  if (len < 0.05) { previewDots.geometry.setDrawRange(0, 0); speedEl.textContent = "—"; return; }
  d.normalize();
  const speed = THREE.MathUtils.clamp(len * 1.6, 0.3, 4.2);
  speedEl.textContent = speed.toFixed(2);
  const pts = shoot(player.x, player.y, d.x, d.y, speed);
  const res = resample(pts, Math.min(MAX_DOTS, Math.max(12, Math.floor(length3D(pts) * 14))));
  currentPreview = { pts: res };
  writeDots(previewDots, res, L.teal, L.mauve, 0.15, 0.55);
});

renderer.domElement.addEventListener("pointerup", (e) => {
  if (e.button !== 0) return;
  if (aiming) {
    aiming = false;
    controls.enabled = true;
    previewDots.geometry.setDrawRange(0, 0);
    if (currentPreview && currentPreview.pts.length > 4) fire(currentPreview.pts);
    currentPreview = null;
    speedEl.textContent = "—";
  } else if (grabbing) {
    grabbing = false;
    controls.enabled = true;
  } else if (downAt && !moved && downUV) {
    placeMarble(downUV.x, downUV.y);
  }
  downAt = null; downUV = null;
});

const MOVE_KEYS = new Set(["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright", " ", "shift"]);
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "r") { document.getElementById("reload").click(); return; }
  if (k === "1") { setMode("pinball"); return; }
  if (k === "2" || k === "m") { setMode(mode === "pinball" ? "walk" : "pinball"); return; }
  if (k === "f") { follow = !follow; return; }
  if (MOVE_KEYS.has(k)) { walk.keys.add(k); e.preventDefault(); }
});
addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  if (MOVE_KEYS.has(k)) walk.keys.delete(k);
});
addEventListener("blur", () => walk.keys.clear());

document.getElementById("reload").addEventListener("click", () => {
  newTerrain(); buildTerrain();
  if (active) finishActive(performance.now(), false);
  placeMarble(-1.6, -1.6);
  ghosts.forEach(g => { scene.remove(g); g.geometry.dispose(); g.material.dispose(); });
  ghosts = [];
  previewDots.geometry.setDrawRange(0, 0);
  currentPreview = null;
});

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function updateFollow() {
  if (!follow) return;
  const target = new THREE.Vector3(player.x, player.y, heightAt(player.x, player.y));
  const delta = target.clone().sub(controls.target);
  controls.target.add(delta);
  camera.position.add(delta);
}

/* ============================================================
   Loop
   ============================================================ */
let lastFrame = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;

  pulse(now / 1000);
  if (mode === "pinball") {
    updateActive(now, dt);
  } else {
    walk.acc += dt;
    let steps = 0;
    while (walk.acc >= FIXED_DT && steps < 8) {
      stepWalk(FIXED_DT);
      walk.acc -= FIXED_DT;
      steps++;
    }
    speedEl.textContent = Math.hypot(walk.s[2], walk.s[3]).toFixed(2);
  }
  updateImpact(now);
  updateFollow();
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
