<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="sans-serif" font-size="13">
  <!-- true geodesic (grey); the RK4 step hugs it -->
  <path d="M 60 190 Q 360 60 660 60" fill="none" stroke="#bbb" stroke-width="6" opacity="0.5"/>
  <!-- the one rk4 step: from s (on the curve) to the next state (also on the curve) -->
  <path d="M 90 177 Q 280 105 420 81" fill="none" stroke="#d33" stroke-width="3"/>
  <circle cx="90" cy="177" r="5" fill="#d33"/>
  <circle cx="420" cy="81" r="5" fill="#d33"/>
  <g stroke-linecap="round">
    <!-- k1: slope at the start state -->
    <g stroke="#1a6bb5" stroke-width="3" fill="#1a6bb5">
      <line x1="90" y1="177" x2="152" y2="150"/><polygon points="158,147 147,158 143,148"/>
    </g>
    <text x="40" y="215" fill="#1a6bb5">k₁ = field h s   (start)</text>
    <!-- k2: slope at the midpoint probe -->
    <g stroke="#3aa04a" stroke-width="3" fill="#3aa04a">
      <line x1="267" y1="117" x2="329" y2="101"/><polygon points="335,98 324,107 320,97"/>
    </g>
    <text x="215" y="225" fill="#3aa04a">k₂ = field h (s + (dt/2) k₁)</text>
    <!-- k3: slope at the second midpoint probe -->
    <g stroke="#c47f00" stroke-width="3" fill="#c47f00">
      <line x1="285" y1="111" x2="350" y2="93"/><polygon points="356,90 345,99 341,89"/>
    </g>
    <text x="300" y="70" fill="#c47f00">k₃ = field h (s + (dt/2) k₂)</text>
    <!-- k4: slope at the end probe -->
    <g stroke="#7a1ab5" stroke-width="3" fill="#7a1ab5">
      <line x1="420" y1="81" x2="486" y2="64"/><polygon points="492,62 481,70 477,60"/>
    </g>
    <text x="450" y="110" fill="#7a1ab5">k₄ = field h (s + dt k₃)   (end)</text>
  </g>
  <text x="360" y="250" text-anchor="middle" fill="#345">rk4Step: sₙ₊₁ = s + (dt/6)(k₁ + 2k₂ + 2k₃ + k₄) — the step lands on the true path (grey)</text>
</svg>
