<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="sans-serif" font-size="14">

  <g font-size="13">
  <path d="M 60 190 Q 360 60 660 60" fill="none" stroke="#6c7086" stroke-width="6" opacity="0.45"/>
  <path d="M 90 177 Q 280 105 420 81" fill="none" stroke="#f38ba8" stroke-width="3"/>
  <circle cx="90" cy="177" r="5" fill="#f38ba8"/>
  <circle cx="420" cy="81" r="5" fill="#f38ba8"/>
  <g stroke-linecap="round">
    <g stroke="#89b4fa" stroke-width="3" fill="#89b4fa">
      <line x1="90" y1="177" x2="152" y2="150"/><polygon points="158,147 147,158 143,148"/>
    </g>
    <text x="40" y="215" fill="#89b4fa">k₁ = field h s   (start)</text>
    <g stroke="#a6e3a1" stroke-width="3" fill="#a6e3a1">
      <line x1="267" y1="117" x2="329" y2="101"/><polygon points="335,98 324,107 320,97"/>
    </g>
    <text x="215" y="225" fill="#a6e3a1">k₂ = field h (s + (dt/2) k₁)</text>
    <g stroke="#f9e2af" stroke-width="3" fill="#f9e2af">
      <line x1="285" y1="111" x2="350" y2="93"/><polygon points="356,90 345,99 341,89"/>
    </g>
    <text x="300" y="70" fill="#f9e2af">k₃ = field h (s + (dt/2) k₂)</text>
    <g stroke="#cba6f7" stroke-width="3" fill="#cba6f7">
      <line x1="420" y1="81" x2="486" y2="64"/><polygon points="492,62 481,70 477,60"/>
    </g>
    <text x="450" y="110" fill="#cba6f7">k₄ = field h (s + dt k₃)   (end)</text>
  </g>
  <text x="360" y="250" text-anchor="middle" fill="#a6adc8">rk4Step: sₙ₊₁ = s + (dt/6)(k₁ + 2k₂ + 2k₃ + k₄) — the step lands on the true path (grey)</text>
  </g>
