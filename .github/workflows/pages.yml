name: GitHub Pages (interactive viewer)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync notes/interactive to the gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git switch --orphan gh-pages
          rm -rf interactive
          mkdir -p interactive
          cp notes/interactive/*.html interactive/
          cat > index.html <<'EOF'
          <!DOCTYPE html><meta http-equiv="refresh" content="0; url=interactive/surface.html">
          EOF
          git add index.html interactive
          git commit -m "sync interactive viewer from master" || echo "nothing to commit"
          git push origin gh-pages
